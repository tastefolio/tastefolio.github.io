name: Build and deploy gallery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # re-read the 👍 counts that order the gallery

permissions:
  contents: read
  pages: write
  id-token: write
  discussions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for screenshots and gallery tests
        run: npx playwright install --with-deps chromium
      - name: Sync runtime, adapters and marketplace
        run: npm run sync
      - name: Validate skills
        run: npm run check
      - name: Capture real screenshots of every demo
        run: npm run shots
      - name: Build gallery
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check internal links
        run: npm run linkcheck
      - name: Test gallery behaviour
        run: npm run test:gallery
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
